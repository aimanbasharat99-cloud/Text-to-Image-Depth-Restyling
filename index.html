<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Retrieval UI</title>
<style>
body { font-family: Arial; margin: 20px; }
input, button, select { margin: 5px; padding: 5px; }
img { max-width: 200px; margin: 10px; border: 1px solid #ccc; }
.result { display: inline-block; text-align: center; margin: 10px; }
</style>
</head>
<body>
<h2>Text-to-Image Retrieval</h2>

<input type="text" id="query" placeholder="Enter your search query" size="50">
<input type="number" id="top_k" value="5" min="1" max="20">
<button onclick="searchImages()">Search</button>
<button onclick="clearResults()">Clear</button>

<div id="results"></div>

<script>
async function searchImages() {
    const query = document.getElementById("query").value;
    const top_k = parseInt(document.getElementById("top_k").value);
    if (!query) return alert("Enter a query!");
    
    const response = await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, top_k })
    });
    const data = await response.json();
    
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";
    data.results.forEach(item => {
        const div = document.createElement("div");
        div.className = "result";
        const img = document.createElement("img");
        img.src = "data:image/png;base64," + item.image;
        const score = document.createElement("div");
        score.innerText = "Score: " + item.score.toFixed(3);
        div.appendChild(img);
        div.appendChild(score);
        resultsDiv.appendChild(div);
    });
}

function clearResults() {
    document.getElementById("results").innerHTML = "";
    document.getElementById("query").value = "";
}
</script>
</body>
</html>
